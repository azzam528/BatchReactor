<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Batch Reactor Intelligence{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                <span class="brand-mark">BR</span>
                Batch Reactor Intelligence
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/history">
                            History
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/model-info">
                            Model Info
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>


    <main>
        {% block content %}{% endblock %}
    </main>


    <footer class="app-footer">

        <div class="container py-4
                d-flex flex-column flex-md-row
                justify-content-between gap-2">

            <small>
                Batch Reactor Prediction & Simulation
            </small>

            <small>
                Decision support only ·
                Not a physical reactor controller
            </small>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block scripts %}{% endblock %}

</body>

</html>
